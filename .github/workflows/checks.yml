name: Python and firmware checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m simulator --output /tmp/agri-demo.csv
      - run: g++ -std=c++11 -Ifirmware/include firmware/test/quality_native.cpp -o /tmp/quality-test
      - run: /tmp/quality-test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio>=6.1,<7'
      - run: python -m platformio run -d firmware -e esp32dev -e esp32dev_rs485
