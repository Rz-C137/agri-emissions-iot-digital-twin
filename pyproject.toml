[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-emissions-iot-digital-twin"
version = "1.0.0"
description = "Virtual commissioning of an agricultural measurement system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["simulator*", "validation*", "thingsboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
