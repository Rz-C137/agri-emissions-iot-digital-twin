<text x="1222.0" y="361" font-size="17" font-weight="normal" text-anchor="middle" style="fill:#fff">SPI storage</text>
<text x="1085" y="425" font-size="18" font-weight="bold" text-anchor="start">Local CSV</text>
<text x="1085" y="448" font-size="18" font-weight="bold" text-anchor="start">data logging</text>
<text x="1085" y="505" font-size="15" font-weight="normal" text-anchor="start">VCC · GND · MISO · MOSI</text>
<text x="1085" y="531" font-size="15" font-weight="normal" text-anchor="start">SCK · CS</text>
<text x="1085" y="557" font-size="15" font-weight="normal" text-anchor="start">DO = MISO; DI = MOSI</text>
<text x="36" y="644" font-size="18" font-weight="bold" text-anchor="start">MQ-2 is used only to demonstrate an analog gas-acquisition channel.</text>
<text x="36" y="674" font-size="17" font-weight="normal" text-anchor="start">It is not treated as a selective NH₃ sensor. All component views describe a virtual prototype, not tested hardware.</text>
